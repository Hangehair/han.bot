<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>接髮評估小幫手</title>
  <style>
    body {
      font-family: 'Helvetica Neue', sans-serif;
      background: #fff9f9;
      padding: 20px;
      color: #333;
    }
    .container {
      max-width: 600px;
      margin: 0 auto;
      background: #fff;
      border-radius: 12px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.1);
      padding: 24px;
    }
    h1 {
      font-size: 24px;
      color: #c84d64;
      text-align: center;
      margin-bottom: 20px;
    }
    .question {
      margin-bottom: 20px;
    }
    label {
      display: block;
      font-weight: bold;
      margin-bottom: 6px;
      color: #444;
    }
    select, input[type="text"] {
      width: 100%;
      padding: 8px;
      border: 1px solid #ddd;
      border-radius: 6px;
      margin-top: 4px;
    }
    button {
      width: 100%;
      padding: 12px;
      background: #ff7c9e;
      border: none;
      color: white;
      font-size: 16px;
      border-radius: 6px;
      cursor: pointer;
    }
    button:hover {
      background: #e96a8c;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>✨ 接髮方案評估 ✨</h1>
    <form id="quiz-form">
      <div class="question">
        <label>1️⃣ 現在的髮型困擾是？</label>
        <select name="q1">
          <option value="髮量少">髮量少</option>
          <option value="長度不夠">長度不夠</option>
          <option value="斷層不自然">斷層不自然</option>
          <option value="其他">其他（請自述）</option>
        </select>
        <input type="text" name="q1_other" placeholder="請填寫">
      </div>

      <div class="question">
        <label>2️⃣ 想要達成的效果？</label>
        <select name="q2">
          <option value="加厚">加厚</option>
          <option value="加長">加長</option>
          <option value="特殊造型">特殊造型</option>
          <option value="其他">其他（請自述）</option>
        </select>
        <input type="text" name="q2_other" placeholder="請填寫">
      </div>

      <div class="question">
        <label>3️⃣ 是否有接髮經驗？</label>
        <select name="q3">
          <option value="沒有">沒有</option>
          <option value="有，但經驗不佳">有，但經驗不佳</option>
          <option value="有，覺得效果還不錯">有，覺得效果還不錯</option>
        </select>
      </div>

      <div class="question">
        <label>4️⃣ 為什麼這次想接髮？</label>
        <select name="q4">
          <option value="重要活動（婚禮/拍照等）">重要活動（婚禮/拍照等）</option>
          <option value="單純想改變風格">單純想改變風格</option>
          <option value="長期接髮族">長期接髮族</option>
          <option value="其他">其他（請自述）</option>
        </select>
        <input type="text" name="q4_other" placeholder="請填寫">
      </div>

      <div class="question">
        <label>5️⃣ 平常會染燙嗎？</label>
        <select name="q5">
          <option value="會，定期染燙">會，定期染燙</option>
          <option value="偶爾染燙">偶爾染燙</option>
          <option value="不會染燙">不會染燙</option>
        </select>
      </div>

      <div class="question">
        <label>6️⃣ 最快想接髮的時間？</label>
        <select name="q6">
          <option value="1個禮拜內">1個禮拜內</option>
          <option value="這個月內">這個月內</option>
          <option value="下個月">下個月</option>
          <option value="我還在評估">我還在評估</option>
        </select>
      </div>

      <div class="question">
        <label>7️⃣ 預算範圍？</label>
        <select name="budget">
          <option value="12000">12000 元</option>
          <option value="15000">15000 元</option>
          <option value="18000">18000 元</option>
          <option value="推薦合適款式">推薦合適款式</option>
        </select>
      </div>

      <div class="question">
        <label>8️⃣ 髮質狀況？</label>
        <select name="hairQuality">
          <option value="頭髮粗硬（髮量多）">頭髮粗硬（髮量多）</option>
          <option value="頭髮細軟（髮量少）">頭髮細軟（髮量少）</option>
          <option value="頭髮粗細適中（髮量適中）">頭髮粗細適中（髮量適中）</option>
        </select>
      </div>

      <button type="submit">✨ 送出並查看推薦方案 ✨</button>
    </form>
  </div>

  <script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      liff.init({ liffId: "2007657502-N6Xb70bg" }).catch(console.error);

      const form = document.getElementById('quiz-form');
      ['q1','q2','q4'].forEach(name => {
        const sel = form.elements[name], inp = form.elements[`${name}_other`];
        const show = () => inp.style.display = sel.value === "其他" ? "block" : "none";
        sel.addEventListener("change", show); show();
      });

      form.addEventListener("submit", async (e) => {
        e.preventDefault();

        const getValue = name => {
          const v = form.elements[name].value;
          const o = form.elements[`${name}_other`] ? form.elements[`${name}_other`].value : "";
          return v === "其他" ? o : v;
        };

        const data = {
          髮型困擾: getValue("q1"),
          接髮效果: getValue("q2"),
          接髮經驗: getValue("q3"),
          想接髮原因: getValue("q4"),
          染燙習慣: getValue("q5"),
          想接髮時間: getValue("q6"),
          預算範圍: form.elements["budget"].value,
          髮質狀況: form.elements["hairQuality"].value
        };

        const contents = [
          { type: "text", text: "接髮評估結果", weight: "bold", size: "lg", color: "#c84d64" },
          { type: "text", text: "你的填寫內容：", weight: "bold", margin: "md" },
          ...Object.entries(data).map(([k, v]) => ({
            type: "text", text: `${k}：${v}`, size: "sm", wrap: true, color: "#333"
          }))
        ];

        const flex = {
          type: "flex",
          altText: "接髮評估結果",
          contents: {
            type: "bubble",
            size: "mega",
            body: {
              type: "box",
              layout: "vertical",
              spacing: "sm",
              paddingAll: "20px",
              backgroundColor: "#ffffff",
              contents
            },
            styles: {
              body: {
                backgroundColor: "#fff8f9"
              }
            }
          }
        };

        try {
          await liff.sendMessages([
            { type: "text", text: "接髮價位" },
            flex
          ]);
          alert("✅ 已成功發送！");
          liff.closeWindow();
        } catch (err) {
          console.error(err);
          alert("❌ 傳送失敗，請在 LINE App 中開啟重試");
        }
      });
    });
  </script>
</body>
</html>
