<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>接髮評估小幫手</title>
  <style>
    body {
      font-family: 'Helvetica Neue', sans-serif;
      background: #fff9f9;
      padding: 20px;
      color: #333;
    }
    .container {
      max-width: 600px;
      margin: 0 auto;
      background: #fff;
      border-radius: 12px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.1);
      padding: 24px;
    }
    h1 {
      font-size: 24px;
      color: #c84d64;
      text-align: center;
      margin-bottom: 20px;
    }
    .message {
      text-align: center;
      font-size: 16px;
      color: #c84d64;
    }
    .hidden {
      display: none;
    }
    button {
      width: 100%;
      padding: 12px;
      background: #ff7c9e;
      border: none;
      color: white;
      font-size: 16px;
      border-radius: 6px;
      cursor: pointer;
    }
    button:hover {
      background: #e96a8c;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>✨ 接髮方案評估 ✨</h1>
    <p class="message hidden" id="not-in-line-app">
      📱 請使用 LINE App 開啟此網頁，否則可能無法正常運作。
    </p>
    <form id="quiz-form" class="hidden">
      <!-- 你的問題表單內容 -->
      <button type="submit">✨ 送出並查看推薦方案 ✨</button>
    </form>
  </div>

  <script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', async () => {
      try {
        await liff.init({ liffId: "2007657502-N6Xb70bg" });
        if (!liff.isInClient()) {
          // 非 LINE App 瀏覽器
          document.getElementById('not-in-line-app').classList.remove('hidden');
        } else {
          // LINE App 瀏覽器內正常啟用
          document.getElementById('quiz-form').classList.remove('hidden');
        }
      } catch (err) {
        console.error("LIFF 初始化失敗:", err);
        alert("❌ LIFF 初始化失敗，請稍後再試！");
      }
    });
  </script>
</body>
</html>
