<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>接髮評估小幫手</title>
  <style>
    body {
      font-family: 'Helvetica Neue', sans-serif;
      background: #fff9f9;
      padding: 20px;
      color: #333;
    }
    .container {
      max-width: 600px;
      margin: 0 auto;
      background: #fff;
      border-radius: 12px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.1);
      padding: 24px;
    }
    h1 {
      font-size: 24px;
      color: #c84d64;
      text-align: center;
      margin-bottom: 20px;
    }
    .question {
      margin-bottom: 20px;
    }
    label {
      display: block;
      font-weight: bold;
      margin-bottom: 6px;
      color: #444;
    }
    select, input[type="text"] {
      width: 100%;
      padding: 8px;
      border: 1px solid #ddd;
      border-radius: 6px;
      margin-top: 4px;
    }
    button {
      width: 100%;
      padding: 12px;
      background: #ff7c9e;
      border: none;
      color: white;
      font-size: 16px;
      border-radius: 6px;
      cursor: pointer;
    }
    button:hover {
      background: #e96a8c;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>✨ 接髮方案評估 ✨</h1>
    <form id="quiz-form">
      <!-- 問題部分維持不變 -->
      <!-- 你的問題表單內容 -->
    </form>
    <p>📱 請確保在 LINE App 瀏覽器中開啟此頁面。</p>
  </div>

  <script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      liff.init({ liffId: "2007657502-N6Xb70bg" })
        .then(() => console.log("LIFF initialized"))
        .catch(err => {
          console.error("LIFF 初始化失敗:", err);
          alert("❌ LIFF 初始化失敗，請稍後再試！");
        });

      const form = document.getElementById('quiz-form');

      ['q1', 'q2', 'q4'].forEach(name => {
        const sel = form.elements[name], inp = form.elements[`${name}_other`];
        const show = () => inp.style.display = sel.value === "其他" ? "block" : "none";
        sel.addEventListener("change", show); show();
      });

      form.addEventListener("submit", async (e) => {
        e.preventDefault();

        const getValue = name => {
          const v = form.elements[name].value;
          const o = form.elements[`${name}_other`] ? form.elements[`${name}_other`].value : "";
          return v === "其他" ? o : v;
        };

        const data = {
          髮型困擾: getValue("q1"),
          接髮效果: getValue("q2"),
          接髮經驗: getValue("q3"),
          想接髮原因: getValue("q4"),
          染燙習慣: getValue("q5"),
          想接髮時間: getValue("q6"),
          預算範圍: form.elements["budget"].value,
          髮質狀況: form.elements["hairQuality"].value
        };

        const summary = Object.entries(data)
          .map(([k, v]) => `${k}：${v}`)
          .join('\n');

        const bubble = {
          type: "bubble",
          size: "mega",
          body: {
            type: "box",
            layout: "vertical",
            spacing: "md",
            paddingAll: "20px",
            backgroundColor: "#fff8f9",
            contents: [
              {
                type: "text",
                text: "接髮評估結果",
                weight: "bold",
                size: "xl",
                color: "#c84d64",
                align: "center"
              },
              {
                type: "separator",
                margin: "md"
              },
              {
                type: "box",
                layout: "vertical",
                margin: "md",
                contents: [
                  {
                    type: "text",
                    text: summary,
                    size: "sm",
                    wrap: true,
                    color: "#333"
                  }
                ]
              }
            ]
          }
        };

        try {
          await liff.sendMessages([
            { type: "flex", altText: "接髮評估結果", contents: bubble }
          ]);
          alert("✅ 已成功發送！");
          liff.closeWindow();
        } catch (err) {
          console.error("訊息傳送失敗:", err);
          alert("❌ 傳送失敗，請在 LINE App 中重試！");
        }
      });
    });
  </script>
</body>
</html>
