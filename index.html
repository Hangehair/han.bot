<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>台北西門町接髮專家Hange韓哥預約系統</title>
  <style>
    body { font-family: 'Arial', sans-serif; display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; background: linear-gradient(135deg,#f8f9fa 0%,#e9ecef 100%); }
    .container { padding:25px; border-radius:15px; background:#fff; box-shadow:0 6px 20px rgba(0,0,0,0.08); width:100%; max-width:450px; }
    .notice { background:linear-gradient(90deg,#f8fafc 80%,#e3f2fd 100%); border-left:4px solid #007bff; padding:15px; margin-bottom:20px; border-radius:8px; color:#2d3748; font-size:14px; line-height:1.6; }
    form { display:flex; flex-direction:column; gap:12px; }
    label { font-weight:600; color:#2d3748; font-size:15px; }
    input, select, button { padding:12px; border:1px solid #e2e8f0; border-radius:8px; font-size:15px; transition:all .3s ease; }
    input:focus, select:focus { border-color:#007bff; box-shadow:0 0 0 3px rgba(0,123,255,0.1); }
    button { background:#fff; color:#007bff; font-weight:600; cursor:pointer; border:2px solid #007bff; }
    button:hover { background:#e3f2fd; }
    .multi-select { display:grid; grid-template-columns:repeat(2,1fr); gap:10px; }
    .multi-select button { padding:12px; border:1px solid #007bff; background:#fff; color:#007bff; border-radius:8px; transition:all .2s; }
    .multi-select button.selected { background:#007bff; color:#fff; }
    .multi-select button:hover:not(.selected){ background:#e3f2fd; }
    .note { font-size:12px; color:#718096; margin-top:-8px; }
  </style>
</head>
<body>
  <div class="container">
    <div class="notice">
      <strong>📢 預約公告</strong><br>
      ✨ 每週星期一、星期二公休<br>
      ✨ 週三～週日預約時段：12:30 - 18:00<br>
      ✨ 其他時段需求歡迎私訊討論！
    </div>
    <form id="bookingForm">
      <label for="name">1. 姓名：</label>
      <input type="text" id="name" placeholder="您的姓名" required>
      <label for="phone">2. 電話：</label>
      <input type="tel" id="phone" maxlength="10" pattern="09[0-9]{8}" placeholder="09XXXXXXXX" value="09" required>
      <label for="date">3. 預約日期：</label>
      <input type="date" id="date" required>
      <label for="time">4. 預約時段：</label>
      <select id="time" required>
        <option value="" disabled selected>請選擇時段</option>
      </select>
      <label>5. 預約項目：</label>
      <div class="multi-select" id="serviceOptions">
        <button type="button" data-value="接髮">接髮</button>
        <button type="button" data-value="染髮">染髮</button>
        <button type="button" data-value="燙髮">燙髮</button>
        <button type="button" data-value="剪髮">剪髮</button>
        <button type="button" data-value="洗髮">洗髮</button>
        <button type="button" data-value="頭髮護理">頭髮護理</button>
        <button type="button" data-value="頭皮護理">頭皮護理</button>
      </div>
      <span class="note">* 可複選多個項目</span>
      <button type="submit">立即預約</button>
    </form>
  </div>

  <script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      const timeSelect = document.getElementById('time');
      for (let h = 12; h <= 18; h++) {
        for (let m = (h === 12 ? 30 : 0); m < 60; m += 30) {
          if (h === 18 && m >= 30) break;
          const t = `${h.toString().padStart(2,'0')}:${m.toString().padStart(2,'0')}`;
          timeSelect.innerHTML += `<option value="${t}">${t}</option>`;
        }
      }

      const dateInput = document.getElementById('date');
      const todayStr = new Date().toISOString().split('T')[0];
      dateInput.min = todayStr;
      const holidays = ["05/06","05/20","05/27"];
      dateInput.addEventListener('change', function(){
        const d = new Date(this.value);
        const md = `${(d.getMonth()+1).toString().padStart(2,'0')}/${d.getDate().toString().padStart(2,'0')}`;
        if ([1,2].includes(d.getDay()) || holidays.includes(md)) {
          alert(`${md} 為公休日，請選其他日期！`);
          this.value = '';
        }
      });

      const sel = new Set();
      document.querySelectorAll('#serviceOptions button').forEach(btn=>{
        btn.addEventListener('click', () => {
          const v = btn.dataset.value;
          btn.classList.toggle('selected');
          sel.has(v) ? sel.delete(v) : sel.add(v);
        });
      });

      liff.init({ liffId: "2006300099-OLXDXZlb" })
        .then(() => liff.getProfile().then(p => {
          document.getElementById('name').value = p.displayName;
        }))
        .catch(console.error);

      document.getElementById('bookingForm').addEventListener('submit', e => {
        e.preventDefault();
        const name = document.getElementById('name').value.trim();
        const phone = document.getElementById('phone').value.trim();
        const date = dateInput.value;
        const time = timeSelect.value;
        const services = Array.from(sel).join(', ');
        if (!services) return alert('請選擇至少一項服務！');

        // .ics 日曆連結
        const title = encodeURIComponent(`預約：${name} - ${services}`);
        const desc  = encodeURIComponent(`預約服務：${services}\n電話：${phone}\n姓名：${name}`);
        const loc   = encodeURIComponent('台北市萬華區西門町');
        const ics   = `https://han-bot-tkfq.vercel.app/api/ics?title=${title}&start=${date}T${time}:00&description=${desc}&location=${loc}`;

        const flexMessage = {
          type: 'flex',
          altText: '預約成功通知',
          contents: {
            type: 'bubble',
            body: {
              type: 'box',
              layout: 'vertical',
              contents: [
                { type: 'text', text: '🎉 預約成功！', weight: 'bold', size: 'lg', align: 'center' },
                { type: 'text', text: `${date} ${time}`, align: 'center', margin: 'md' },
                { type: 'separator', margin: 'md' },
                { type: 'text', text: `姓名：${name}`, margin: 'md' },
                { type: 'text', text: `電話：${phone}`, margin: 'sm' },
                { type: 'text', text: `項目：${services}`, wrap: true, margin: 'sm' }
              ]
            },
            footer: {
              type: 'box',
              layout: 'vertical',
              spacing: 'sm',
              contents: [
                {
                  type: 'button',
                  style: 'primary',
                  action: {
                    type: 'uri',
                    label: '加入手機日曆',
                    uri: ics
                  }
                },
                {
                  type: 'button',
                  style: 'secondary',
                  action: {
                    type: 'uri',
                    label: '查看韓哥髮廊地址',
                    uri: 'https://maps.app.goo.gl/8GQYF3yosEfm8uJa9'
                  }
                }
              ]
            }
          }
        };

        liff.sendMessages([flexMessage])
          .then(() => {
            alert('預約成功！我們已收到您的資料，韓哥將親自與您確認！');
            liff.closeWindow();
          })
          .catch(err => {
            alert('發送訊息失敗：' + (err.message || err));
            console.error(err);
          });
      });
    });
  </script>
</body>
</html>
