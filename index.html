<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>台北西門町接髮專家Hange韓哥預約系統</title>
  <style>
    body {
      font-family: 'Arial', sans-serif;
      display: flex; justify-content: center; align-items: center;
      min-height: 100vh; margin: 0;
      background: linear-gradient(135deg, #f8f9fa, #e9ecef);
    }
    .container {
      padding: 25px; border-radius: 15px;
      background: #fff; box-shadow: 0 6px 20px rgba(0,0,0,0.08);
      width: 100%; max-width: 450px;
    }
    .notice {
      background: linear-gradient(90deg, #f8fafc, #e3f2fd);
      border-left: 4px solid #007bff;
      padding: 15px; margin-bottom: 20px;
      border-radius: 8px; font-size: 14px; line-height: 1.6;
      color: #2d3748;
    }
    form { display: flex; flex-direction: column; gap: 12px; }
    label { font-weight: 600; color: #2d3748; font-size: 15px; }
    input, select, button {
      padding: 12px; border-radius: 8px;
      font-size: 15px; border: 1px solid #e2e8f0;
      transition: all .3s ease;
    }
    input:focus, select:focus {
      border-color: #007bff; box-shadow: 0 0 0 3px rgba(0,123,255,0.1);
    }
    button {
      background: #fff; color: #007bff; font-weight: 600;
      border: 2px solid #007bff; cursor: pointer;
    }
    button:hover { background: #e3f2fd; }
    .multi-select {
      display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px;
    }
    .multi-select button {
      background: #fff; border: 1px solid #007bff; color: #007bff;
      border-radius: 8px; transition: 0.2s;
    }
    .multi-select button.selected {
      background: #007bff; color: #fff;
    }
    .multi-select button:hover:not(.selected) {
      background: #e3f2fd;
    }
    .note { font-size: 12px; color: #718096; margin-top: -8px; }
  </style>
</head>
<body>
  <div class="container">
    <div class="notice">
      <strong>📢 預約公告</strong><br>
      ✨ 每週星期一、星期二公休<br>
      ✨ 週三～週日預約時段：12:30 - 18:00<br>
      ✨ 其他時段需求歡迎私訊討論！
    </div>
    <form id="bookingForm">
      <label for="name">1. 姓名：</label>
      <input type="text" id="name" placeholder="您的姓名" required />
      <label for="phone">2. 電話：</label>
      <input type="tel" id="phone" maxlength="10" pattern="09[0-9]{8}" placeholder="09XXXXXXXX" value="09" required />
      <label for="date">3. 預約日期：</label>
      <input type="date" id="date" required />
      <label for="time">4. 預約時段：</label>
      <select id="time" required>
        <option value="" disabled selected>請選擇時段</option>
      </select>
      <label>5. 預約項目：</label>
      <div class="multi-select" id="serviceOptions">
        <button type="button" data-value="接髮">接髮</button>
        <button type="button" data-value="染髮">染髮</button>
        <button type="button" data-value="燙髮">燙髮</button>
        <button type="button" data-value="剪髮">剪髮</button>
        <button type="button" data-value="洗髮">洗髮</button>
        <button type="button" data-value="頭髮護理">頭髮護理</button>
        <button type="button" data-value="頭皮護理">頭皮護理</button>
      </div>
      <span class="note">* 可複選多個項目</span>
      <button type="submit">立即預約</button>
    </form>
  </div>

  <script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      const timeSelect = document.getElementById('time');
      for (let h = 12; h <= 17; h++) {
        ['00', '30'].forEach(min => {
          if (h === 12 && min === '00') return;
          const t = `${h.toString().padStart(2, '0')}:${min}`;
          const option = new Option(t, t);
          timeSelect.appendChild(option);
        });
      }

      const dateInput = document.getElementById('date');
      dateInput.min = new Date().toISOString().split('T')[0];
      const holidays = ["05/06", "05/20", "05/27"];
      dateInput.addEventListener('change', () => {
        const d = new Date(dateInput.value);
        const md = `${(d.getMonth() + 1).toString().padStart(2, '0')}/${d.getDate().toString().padStart(2, '0')}`;
        if ([1, 2].includes(d.getDay()) || holidays.includes(md)) {
          alert(`${md} 為公休日，請選其他日期！`);
          dateInput.value = '';
        }
      });

      const selectedServices = new Set();
      document.querySelectorAll('#serviceOptions button').forEach(btn => {
        btn.addEventListener('click', () => {
          const value = btn.dataset.value;
          if (selectedServices.has(value)) {
            selectedServices.delete(value);
            btn.classList.remove('selected');
          } else {
            selectedServices.add(value);
            btn.classList.add('selected');
          }
        });
      });

      liff.init({ liffId: "2006300099-OLXDXZlb" })
        .then(() => liff.getProfile().then(p => {
          document.getElementById('name').value = p.displayName;
        }))
        .catch(console.error);

      document.getElementById('bookingForm').addEventListener('submit', e => {
        e.preventDefault();
        const name = document.getElementById('name').value.trim();
        const phone = document.getElementById('phone').value.trim();
        const date = dateInput.value;
        const time = timeSelect.value;
        const services = Array.from(selectedServices).join(', ');
        if (!services) return alert('請選擇至少一項服務！');

        const dtstart = date.replace(/-/g, '') + 'T' + time.replace(':', '') + '00';
        const uid = Date.now() + '@hange-hair';
        const dtstamp = new Date().toISOString().replace(/[-:]/g, '').split('.')[0] + 'Z';
        const icsLines = [
          'BEGIN:VCALENDAR',
          'VERSION:2.0',
          'PRODID:-//Hange-hair//Booking//TW',
          'BEGIN:VEVENT',
          `UID:${uid}`,
          `DTSTAMP:${dtstamp}`,
          `DTSTART:${dtstart}`,
          'DURATION:PT1H',
          'SUMMARY:預約韓哥',
          `DESCRIPTION:預約服務：${services}\\n電話：${phone}\\n姓名：${name}`,
          'LOCATION:台北市萬華區西門町',
          'END:VEVENT',
          'END:VCALENDAR'
        ];
        const icsUri = 'data:text/calendar;charset=utf8,' + encodeURIComponent(icsLines.join('\r\n'));

        const flexMessage = {
          type: 'flex',
          altText: '預約成功通知',
          contents: {
            type: 'bubble',
            header: {
              type: 'box', layout: 'vertical', backgroundColor: '#1DB446',
              contents: [{ type: 'text', text: '預約完成✅', weight: 'bold', color: '#FFFFFF', align: 'center' }]
            },
            body: {
              type: 'box', layout: 'vertical', spacing: 'sm',
              contents: [
                { type: 'text', text: '您的預約詳情：', weight: 'bold', size: 'sm' },
                ...[['姓名', name], ['服務', services], ['日期', date], ['時間', time]].map(([label, val]) => ({
                  type: 'box',
                  layout: 'horizontal',
                  contents: [
                    { type: 'text', text: label, size: 'xs', color: '#888888', flex: 2 },
                    { type: 'text', text: val, size: 'xs', color: '#333333', flex: 5, align: 'end', wrap: true }
                  ]
                }))
              ]
            },
            footer: {
              type: 'box', layout: 'vertical', spacing: 'sm',
              contents: [
                {
                  type: 'button', style: 'primary', color: '#1DB446',
                  action: { type: 'uri', label: '加入行事曆', uri: icsUri }
                },
                {
                  type: 'button', style: 'secondary',
                  action: { type: 'uri', label: '查看韓哥髮廊地址', uri: 'https://maps.app.goo.gl/8GQYF3yosEfm8uJa9' }
                }
              ]
            }
          }
        };

        liff.sendMessages([flexMessage])
          .then(() => {
            alert('預約成功！我們已收到您的資料，韓哥將親自與您確認！');
            liff.closeWindow();
          })
          .catch(err => {
            alert('發送訊息失敗：' + (err.message || err));
            console.error(err);
          });
      });
    });
  </script>
</body>
</html>
