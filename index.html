<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>台北西門町接髮專家Hange韓哥預約系統</title>
  <style>
    body { font-family: Arial, sans-serif; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; background-color: #f8f8f8; }
    .container { padding: 20px; border: 2px solid #ccc; border-radius: 10px; background-color: #fff; box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1); width: 100%; max-width: 400px; }
    form { display: flex; flex-direction: column; gap: 10px; }
    label { font-weight: bold; }
    input, select, button { padding: 10px; border-radius: 5px; border: 1px solid #ccc; font-size: 16px; text-align: center; width: 100%; box-sizing: border-box; }
    button { background-color: #007bff; color: white; cursor: pointer; }
    button:hover { background-color: #0056b3; }
  </style>
</head>
<body>
  <div class="container">
    <form id="bookingForm">
      <label for="name">1.姓名：</label>
      <input type="text" id="name" placeholder="名字" required>

      <label for="phone">2.電話：</label>
      <input type="tel" id="phone" maxlength="10" pattern="09[0-9]{8}" placeholder="09XXXXXXXX" required>

      <label for="date">3.預約日期：</label>
      <input type="date" id="date" required>

      <label for="time">4.預約時段：</label>
      <select id="time" required>
        <option value="" disabled selected>請選擇預約時段</option>
        <option value="13:00">13:00</option>
        <option value="14:00">14:00</option>
        <option value="15:00">15:00</option>
        <option value="16:00">16:00</option>
        <option value="17:00">17:00</option>
      </select>

      <button type="submit">送出預約</button>
    </form>
  </div>

  <script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', function () {
      document.getElementById('bookingForm').addEventListener('submit', function (event) {
        event.preventDefault();

        const name = document.getElementById('name').value;
        const phone = document.getElementById('phone').value;
        const date = document.getElementById('date').value;
        const time = document.getElementById('time').value;

        const flexMessage = {
          "type": "flex",
          "altText": "預約成功通知",
          "contents": {
            "type": "bubble",
            "body": {
              "type": "box",
              "layout": "vertical",
              "spacing": "md",
              "contents": [
                { "type": "text", "text": "💇‍♂️ 預約確認單", "weight": "bold", "color": "#333333", "size": "lg" },
                { "type": "separator", "margin": "md" },
                {
                  "type": "box",
                  "layout": "vertical",
                  "margin": "md",
                  "spacing": "sm",
                  "contents": [
                    { "type": "box", "layout": "horizontal", "contents": [
                        { "type": "text", "text": "👤 姓名", "size": "md", "color": "#555555", "weight": "bold" },
                        { "type": "text", "text": name, "size": "md", "color": "#111111", "align": "end" }
                      ]
                    },
                    { "type": "box", "layout": "horizontal", "contents": [
                        { "type": "text", "text": "📞 電話", "size": "md", "color": "#555555", "weight": "bold" },
                        { "type": "text", "text": phone, "size": "md", "color": "#111111", "align": "end" }
                      ]
                    },
                    { "type": "box", "layout": "horizontal", "contents": [
                        { "type": "text", "text": "📅 預約日期", "size": "md", "color": "#555555", "weight": "bold" },
                        { "type": "text", "text": date, "size": "md", "color": "#111111", "align": "end" }
                      ]
                    },
                    { "type": "box", "layout": "horizontal", "contents": [
                        { "type": "text", "text": "🕒 預約時段", "size": "md", "color": "#555555", "weight": "bold" },
                        { "type": "text", "text": time, "size": "md", "color": "#111111", "align": "end" }
                      ]
                    }
                  ]
                },
                { "type": "separator", "margin": "xxl" },
                {
                  "type": "button",
                  "action": { "type": "uri", "label": "📍 查看地址", "uri": "https://maps.app.goo.gl/8GQYF3yosEfm8uJa9" },
                  "style": "primary",
                  "color": "#007bff"
                },
                {
                  "type": "button",
                  "action": { 
                    "type": "uri", 
                    "label": "📅 新增至行事曆", 
                    "uri": `https://www.google.com/calendar/render?action=TEMPLATE&text=預約+Hange韓哥&dates=${date}T${time.replace(":", "")}00/${date}T${time.replace(":", "")}59`
                  },
                  "style": "primary",
                  "color": "#28a745"
                }
              ]
            }
          }
        };

        liff.sendMessages([flexMessage])
          .then(() => {
            alert('預約成功！請查看 LINE 訊息確認預約。');
            liff.closeWindow();
          })
          .catch(err => console.error('Error sending Flex Message:', err));
      });
    });
  </script>
</body>
</html>
